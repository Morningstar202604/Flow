version: "3.9"

# GlobalEcom AI — 部署编排
# 使用: docker-compose up -d
# 首次启动会自动创建表 (db:push)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: globalecom-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globalecom}
      POSTGRES_USER: ${POSTGRES_USER:-globalecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globalecom_pass_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globalecom} -d ${POSTGRES_DB:-globalecom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globalecom-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-globalecom}:${POSTGRES_PASSWORD:-globalecom_pass_2024}@postgres:5432/${POSTGRES_DB:-globalecom}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
