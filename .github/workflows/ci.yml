name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check (server + client)
        run: npm run type:check

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Build (server + client)
        run: npm run build

  smoke:
    name: E2E Smoke (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: globalecom
          POSTGRES_USER: globalecom
          POSTGRES_PASSWORD: globalecom_pass_2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U globalecom -d globalecom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://globalecom:globalecom_pass_2024@127.0.0.1:5432/globalecom
      NODE_ENV: development
      PORT: '3000'
      SELLER_REGISTRATION_CODE: smoke-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        run: node scripts/db/migrate.mjs

      - name: Build server
        run: npm run build:server

      - name: Start server
        run: |
          node dist-server/server/main.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health; then
              break
            fi
            sleep 2
          done

      - name: Run full workflow smoke (all business flows, no credentials)
        run: SMOKE_BASE=http://127.0.0.1:3000 node scripts/smoke-workflows.mjs

      - name: Run AI degradation smoke (no LLM key)
        run: SMOKE_BASE=http://127.0.0.1:3000 node scripts/smoke-ai-degraded.mjs

      - name: Run smoke tests
        run: SMOKE_BASE=http://127.0.0.1:3000 SMOKE_SELLER_CODE=smoke-secret node scripts/smoke.mjs

  providers:
    name: Providers Smoke (Mock Stripe/PayPal/LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: globalecom
          POSTGRES_USER: globalecom
          POSTGRES_PASSWORD: globalecom_pass_2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U globalecom -d globalecom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://globalecom:globalecom_pass_2024@127.0.0.1:5432/globalecom
      NODE_ENV: development
      PORT: '3130'
      SELLER_REGISTRATION_CODE: smoke-secret
      APP_WEBHOOK_BASE: http://127.0.0.1:3130
      LLM_BASE_URL: http://127.0.0.1:4880/llm
      LLM_API_KEY: mock-key
      LLM_MODEL: deepseek-chat
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_WEBHOOK_SECRET: whsec_mock
      STRIPE_API_BASE: http://127.0.0.1:4880/stripe
      PAYPAL_CLIENT_ID: mock-cid
      PAYPAL_CLIENT_SECRET: mock-sec
      PAYPAL_WEBHOOK_ID: mock-wh
      PAYPAL_API_BASE: http://127.0.0.1:4880/paypal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        run: node scripts/db/migrate.mjs

      - name: Build server
        run: npm run build:server

      - name: Start mock providers
        run: |
          node scripts/mock-providers.mjs &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:4880/_mock/state; then break; fi
            sleep 2
          done

      - name: Start server
        run: |
          node dist-server/server/main.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3130/api/health; then break; fi
            sleep 2
          done

      - name: Run providers smoke (AI agents + Stripe/PayPal chains)
        run: SMOKE_BASE=http://127.0.0.1:3130 MOCK_BASE=http://127.0.0.1:4880 node scripts/smoke-providers.mjs
