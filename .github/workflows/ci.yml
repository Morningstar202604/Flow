name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check (server + client)
        run: npm run type:check

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Build (server + client)
        run: npm run build

  smoke:
    name: E2E Smoke (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flow
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow_pass_2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flow -d flow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://flow:flow_pass_2024@127.0.0.1:5432/flow
      NODE_ENV: development
      SELLER_REGISTRATION_CODE: smoke-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        run: node scripts/db/migrate.mjs

      - name: Build (server + client)
        run: npm run build

      # ---------- Instance A：无任何模型/渠道凭据，验证诚实降级 ----------
      - name: Start server (no provider keys)
        run: |
          PORT=3000 node dist-server/server/main.js > /tmp/server-a.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          echo "server A did not become healthy in time" >&2
          cat /tmp/server-a.log >&2
          exit 1

      - name: Business workflow smoke
        run: SMOKE_BASE=http://127.0.0.1:3000 node scripts/smoke-workflows.mjs

      - name: AI degradation smoke (no LLM key)
        run: SMOKE_BASE=http://127.0.0.1:3000 node scripts/smoke-ai-degraded.mjs

      - name: Transaction smoke
        run: SMOKE_BASE=http://127.0.0.1:3000 SMOKE_SELLER_CODE=smoke-secret node scripts/smoke.mjs

      # ---------- Instance B：本地渠道模拟器 + mock LLM ----------
      # 注意：mock 的 webhook 回调必须打到 B 实例（3100，持有 mock 密钥）；
      # 打到 A 实例会因缺少 STRIPE_WEBHOOK_SECRET 验签失败（历史 CI 红灯根因）。
      - name: Start provider mock
        run: |
          MOCK_PORT=4880 \
          APP_WEBHOOK_BASE=http://127.0.0.1:3100 \
          STRIPE_WEBHOOK_SECRET=whsec_mock \
          node scripts/mock-providers.mjs > /tmp/mock.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4880/_mock/state; then exit 0; fi
            sleep 1
          done
          echo "mock providers did not start" >&2
          cat /tmp/mock.log >&2
          exit 1

      - name: Start server (mock providers + LLM)
        run: |
          PORT=3100 \
          LLM_BASE_URL=http://127.0.0.1:4880/llm \
          LLM_API_KEY=mock-key \
          LLM_MODEL=mock-model \
          STRIPE_SECRET_KEY=sk_test_mock \
          STRIPE_WEBHOOK_SECRET=whsec_mock \
          STRIPE_API_BASE=http://127.0.0.1:4880/stripe \
          PAYPAL_CLIENT_ID=mock-cid \
          PAYPAL_CLIENT_SECRET=mock-sec \
          PAYPAL_WEBHOOK_ID=mock-wh \
          PAYPAL_API_BASE=http://127.0.0.1:4880/paypal \
          node dist-server/server/main.js > /tmp/server-b.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/api/health; then exit 0; fi
            sleep 2
          done
          echo "server B did not become healthy in time" >&2
          cat /tmp/server-b.log >&2
          exit 1

      - name: Provider smoke
        run: SMOKE_BASE=http://127.0.0.1:3100 MOCK_BASE=http://127.0.0.1:4880 node scripts/smoke-providers.mjs

      - name: Copilot smoke
        run: SMOKE_BASE=http://127.0.0.1:3100 MOCK_BASE=http://127.0.0.1:4880 node scripts/smoke-copilot.mjs

      - name: Shopper smoke
        run: SMOKE_BASE=http://127.0.0.1:3100 MOCK_BASE=http://127.0.0.1:4880 node scripts/smoke-shopper.mjs

      # ---------- SEO / 机器可读端点（生产构建的 SPA 回退 + 注入） ----------
      - name: Verify SEO endpoints
        run: |
          for path in /sitemap.xml /robots.txt /llms.txt /api/openapi.json "/api/seo/meta?path=/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -sf http://127.0.0.1:3100/ | grep -q 'application/ld+json'

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '===== server A ====='; tail -200 /tmp/server-a.log || true
          echo '===== server B ====='; tail -200 /tmp/server-b.log || true
          echo '===== mock ====='; tail -100 /tmp/mock.log || true
