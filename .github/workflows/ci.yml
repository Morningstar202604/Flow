name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check (server + client)
        run: npm run type:check

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Build (server + client)
        run: npm run build

  smoke:
    name: E2E Smoke (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flow
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow_pass_2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flow -d flow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://flow:flow_pass_2024@127.0.0.1:5432/flow
      NODE_ENV: development
      PORT: '3000'
      SELLER_REGISTRATION_CODE: smoke-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        run: node scripts/db/migrate.mjs

      - name: Build server
        run: npm run build:server

      - name: Start server and wait for health
        run: |
          node dist-server/server/main.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "server did not become healthy in time" >&2
          exit 1

      - name: Business workflow smoke
        run: SMOKE_BASE=http://127.0.0.1:3000 node scripts/smoke-workflows.mjs

      - name: AI degradation smoke (no LLM key)
        run: SMOKE_BASE=http://127.0.0.1:3000 node scripts/smoke-ai-degraded.mjs

      - name: Transaction smoke
        run: SMOKE_BASE=http://127.0.0.1:3000 SMOKE_SELLER_CODE=smoke-secret node scripts/smoke.mjs
