version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns:
          - '@nestjs/*'
      radix:
        patterns:
          - '@radix-ui/*'
      dev-tooling:
        patterns:
          - 'eslint*'
          - 'typescript*'
          - 'vitest*'
          - 'vite*'
    ignore:
      # 主版本升级需要人工评估，避免自动 PR 破坏兼容性
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
