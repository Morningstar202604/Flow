version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns:
          - '@nestjs/*'
      radix:
        patterns:
          - '@radix-ui/*'
      dev-tooling:
        patterns:
          - 'eslint*'
          - 'typescript*'
          - 'vitest*'
          - 'vite*'
    ignore:
      # 主版本升级需要人工评估，避免自动 PR 破坏兼容性
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      # Action 主版本升级（如 v4→v7）需人工验证，避免自动 PR 制造红灯
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # 基础镜像主版本（node 22→25）不自动跟随，需单独评估兼容性
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
